# Optional "standard" SPARQL endpoint (Apache Jena Fuseki) as an alternative
# to the zero-install web/server.py. Start it, then load the graphs with
# etl/load_fuseki.py:
#
#   docker compose up -d
#   python etl/load_fuseki.py
#
# The UI in web/ works against either endpoint (set the Endpoint field to
# http://127.0.0.1:3030/ds/sparql). Use 127.0.0.1, not localhost: on Windows
# localhost resolves to IPv6 first and Docker only publishes IPv4, adding ~20s
# per new connection.

services:
  fuseki:
    image: stain/jena-fuseki:latest
    container_name: linked-drinks-fuseki
    ports:
      - "3030:3030"
    environment:
      ADMIN_PASSWORD: admin
      FUSEKI_DATASET_1: ds
    restart: unless-stopped
